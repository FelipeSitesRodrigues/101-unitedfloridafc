<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finalizar pedido | Loja United Florida FC</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/loja/loja.css">
</head>
<body>
<header class="chk-topo"><div class="caixa">
  <a href="/loja/" aria-label="Voltar para a loja"><img src="/assets/img/escudo-120.webp" alt="" width="120" height="133"></a>
  <span class="seguro">Pedido pelo WhatsApp</span>
  <button class="sacola-btn" type="button" data-abrir-sacola aria-label="Abrir a sacola"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 8h14l1 13H4L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span data-qtd>0</span></button>
</div></header>
<main class="caixa chk">
  <form id="form" novalidate>
    <fieldset><legend>Seus <b>dados</b></legend>
      <p class="chk__aviso">Sem pagamento aqui no site: o pedido vai para o WhatsApp do clube, que confirma o valor, o frete e a forma de pagamento com você.</p>
      <div class="campos">
        <input class="c3" name="nome" aria-label="Nome" placeholder="Seu nome" autocomplete="name" required>
        <input class="c3" name="cidade" aria-label="Cidade e estado" placeholder="Cidade e estado" autocomplete="address-level2" required>
        <input name="cep" aria-label="CEP" placeholder="CEP (para o frete)" inputmode="numeric" autocomplete="postal-code">
        <textarea name="obs" aria-label="Observação" placeholder="Observação (opcional): nome e número na camisa, outra cor, dúvidas" rows="3"></textarea>
      </div>
      <p class="chk__erro" id="erro" role="alert" hidden>Preencha seu nome e sua cidade.</p>
    </fieldset>
    <button class="vidro-azul pagar whats" type="submit" id="enviar"></button>
    <a class="termos" href="/loja/">Continuar comprando</a>
  </form>
  <aside class="resumo" aria-label="Resumo do pedido">
    <h2>Seu <b>pedido</b> (<span data-qtd>0</span>)</h2>
    <div id="itens"></div>
    <div class="linhas" id="linhas"></div>
    <p class="resumo__selo">Produto oficial · Envio para todo o Brasil</p>
  </aside>
</main>
<script src="/loja/loja.js"></script>
<script>
const form = document.getElementById('form')
function desenhar() {
  const itens = ler()
  document.getElementById('itens').innerHTML = itens.length ? itens.map((i) => itemHtml(i, false)).join('') : '<p class="vazio" style="color:#fff">Sua sacola está vazia. <a href="/loja/" style="text-decoration:underline;display:inline;margin:0;padding:0;min-height:0">Ver a coleção</a></p>'
  document.getElementById('linhas').innerHTML = `<div><span>${contagem(itens)} ${contagem(itens) === 1 ? 'item' : 'itens'}</span><span>${comPreco(itens) && itens.length ? brl(subtotal(itens)) : 'valor no WhatsApp'}</span></div>`
  const botao = document.getElementById('enviar')
  botao.innerHTML = `${ZAP}Enviar pedido pelo WhatsApp`
  botao.disabled = !itens.length
  botao.style.opacity = itens.length ? '' : '.5'
}
document.addEventListener('sacola', desenhar)
form.addEventListener('submit', (e) => {
  e.preventDefault()
  const itens = ler()
  if (!itens.length) return
  const faltando = [...form.querySelectorAll('[required]')].filter((c) => !c.value.trim())
  document.getElementById('erro').hidden = !faltando.length
  if (faltando.length) return faltando[0].focus()
  const dados = Object.fromEntries([...new FormData(form)].map(([k, v]) => [k, String(v).trim()]))
  window.open(linkPedido(itens, dados), '_blank', 'noopener')
})
desenhar()
</script>
</body>
</html>
