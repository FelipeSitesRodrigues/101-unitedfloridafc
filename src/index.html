  <link rel="preload" href="/assets/fonts/inter-tight.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // js: liga as animações de entrada (sem JS tudo aparece no lugar). js-abrindo: até a primeira
    // pintura a foto do clube (seção vizinha do hero) fica fora, pra não disputar a banda com a
    // foto do hero no celular (memória cv-secao-vizinha-hero-lcp). Sai na 1ª pintura ou em 2,5 s.
    (function () {
      var h = document.documentElement
      h.classList.add('js', 'js-abrindo')
      var pronto = function () { h.classList.remove('js-abrindo') }
      try {
        new PerformanceObserver(function (l) { if (l.getEntriesByName('first-contentful-paint').length) pronto() }).observe({ type: 'paint', buffered: true })
      } catch (e) { pronto() }
      setTimeout(pronto, 2500)
    })()
  </script>
